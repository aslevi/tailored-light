<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Order status · Hello Shade</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FBF6F0">
<meta name="color-scheme" content="light">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../api/pages.css">
<style>
.summary{margin:16px 0 0;padding:18px 16px}
.summary .status{font-family:var(--serif);font-size:26px;line-height:1.2;margin:0}
.summary .eta{margin:6px 0 0;color:var(--muted)}
.summary .eta b{color:var(--cocoa);font-weight:600}
.summary .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.summary .meta a{display:inline-flex;align-items:center;min-height:44px;margin:-12px 0}
.summary .meta{align-items:center}
.summary .meta b{color:var(--cocoa);font-weight:600}

.timeline{list-style:none;margin:24px 0 0;padding:0}
.step{position:relative;display:grid;grid-template-columns:32px 1fr;gap:14px;padding-bottom:22px}
.step:last-child{padding-bottom:0}
.step::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step.done::before{background:var(--ok)}
.dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);border:2px solid var(--line);position:relative;z-index:1}
.step.done .dot{background:var(--ok);border-color:var(--ok)}
.step.done .dot svg{display:block}
.dot svg{display:none;width:16px;height:16px}
.step.current .dot{border-color:var(--rose);background:var(--surface);box-shadow:0 0 0 5px var(--blush)}
.step.current .dot::after{content:'';width:12px;height:12px;border-radius:50%;background:var(--rose)}
.step .txt{padding-top:4px;min-width:0}
.step h2{font:600 17px/1.3 var(--sans);letter-spacing:0;margin:0;color:var(--cocoa)}
.step.todo h2{color:var(--muted);font-weight:500}
.step .when{font-size:14px;color:var(--muted);margin:2px 0 0}
.step.current .panel{margin-top:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--rose);border-radius:12px}
.panel p{margin:0;font-size:15px}
.panel .btn{margin-top:12px}
.track{display:inline-flex;align-items:center;min-height:44px;font-weight:600}
.cta{display:grid;gap:10px;margin:28px 0 0}
@media (min-width:640px){.cta{grid-template-columns:1fr 1fr}}
</style>
<script src="../api/config.js"></script>
<script src="../api/client.js" defer></script>
<script defer src="../flow/analytics.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="banner"></div>
<header class="site-header">
 <div class="wrap bar">
  <a class="brand" href="../"><span class="wordmark" role="img" aria-label="Hello Shade">hello shade<svg viewBox="0 0 64 40" aria-hidden="true"><path d="M32 12V4M43 14.9L47 8M21 14.9L17 8M51 23L58 19M13 23L6 19" stroke="#E8AE45" stroke-width="3.5" stroke-linecap="round"/><path d="M14 34A18 18 0 0 1 50 34Z" fill="#E8AE45"/><rect x="2" y="34" width="60" height="3" rx="1.5" fill="#A9594A"/></svg></span></a>
  <a class="btn gold sm" id="hdr-text" href="sms:+12017453300">Text a designer</a>
 </div>
</header>

<main id="main" class="wrap" aria-live="polite" aria-busy="true">
 <div class="state"><p>Loading your order…</p></div>
</main>

<footer class="foot wrap">
 <a href="../how-to-measure/">How to measure</a> · <a href="../how-to-install/">How to install</a> · <a href="../faq/">FAQ</a>
</footer>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var HS = window.HS, esc = HS.esc;
  var main = document.getElementById('main');
  var token = HS.readToken();
  var CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.3l3 3 6-6.3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var LONG = { weekday: 'short', month: 'short', day: 'numeric' };

  function render(d) {
    if (d.demo) document.getElementById('banner').innerHTML = '<div class="demo-banner" role="note"><b>Sample data</b> — your real project appears here once Dana sends your link</div>';
    var o = d.order || {};
    var c = d.customer || {};
    var code = c.designCode ? ' (' + c.designCode + ')' : '';
    var sms = HS.smsHref('Hi Dana! Question about ' + (o.name || 'my order') + code + '.');
    document.getElementById('hdr-text').href = sms;

    var shipFrom = o.paidDate ? HS.addDays(o.paidDate, 14) : null;
    var shipTo = o.paidDate ? HS.addDays(o.paidDate, 28) : null;
    var remakeUntil = o.freeRemakeUntil || (o.deliveredDate ? HS.addDays(o.deliveredDate, 30) : null);
    var trackHref = HS.trackingUrl(o.tracking);

    var steps = [
      { key: 'samples',  name: 'Samples sent',    date: o.samplesSentDate },
      { key: 'measured', name: 'Measured',        date: o.measuredDate },
      { key: 'checked',  name: 'Checked by Dana', date: o.checkedDate },
      { key: 'paid',     name: 'Paid',            date: o.paidDate },
      { key: 'prod',     name: 'In production',   date: o.orderedDate },
      { key: 'shipped',  name: 'Shipped',         date: o.shippedDate },
      { key: 'delivered',name: 'Delivered',       date: o.deliveredDate },
      { key: 'installed',name: 'Installed',       date: o.installedDate }
    ];
    // A step is done if it has a date, or any later step does (e.g. samples skipped).
    var last = -1;
    steps.forEach(function (s, i) { if (s.date) last = i; });
    steps.forEach(function (s, i) { s.done = i <= last; });
    // "In production" and "Shipped" are ongoing states: stay highlighted until the next date lands.
    var cur;
    if (last === steps.length - 1) cur = -1;
    else if (last >= 0 && (steps[last].key === 'prod' || steps[last].key === 'shipped')) cur = last;
    else cur = last + 1;

    var panels = {
      samples: 'Your samples are on the way. Hold them up to the window in daylight and at night.',
      measured: 'Measure each window and text Dana your numbers and a photo of the tape. It takes about 10 minutes a window.',
      checked: 'Dana is checking every number and photo before anything is made. You’ll get a text when she’s done.',
      paid: 'Everything’s checked. Pay when you’re ready and we’ll start making your shades.',
      prod: 'Your shades are being made to your exact size.' + (shipFrom ? ' Estimated to ship <b>' + esc(HS.date(shipFrom)) + ' \u2013 ' + esc(HS.date(shipTo)) + '</b>.' : ''),
      shipped: 'Your shades are on the way.' + (trackHref ? '' : ' Tracking will show here as soon as the carrier scans the box.'),
      installed: 'Your shades have arrived. Most go up in about 15 minutes with a drill and a pencil.'
    };
    var curKey = cur >= 0 ? steps[cur].key : null;

    function extra(s) {
      var out = '';
      if (s.key === 'shipped' && s.done && trackHref && s !== steps[cur]) out += '<a class="track" href="' + esc(trackHref) + '" rel="noopener" target="_blank">Track your package<span class="visually-hidden"> (opens in a new tab)</span> →</a>';
      return out;
    }

    function panelFor(s) {
      var p = panels[s.key] || '';
      var btn = '';
      if (s.key === 'measured') btn = '<a class="btn sm" href="../how-to-measure/">How to measure</a>';
      if (s.key === 'paid' && o.payUrl && /^https:\/\//.test(o.payUrl)) btn = '<a class="btn sm" href="' + esc(o.payUrl) + '" rel="noopener">Pay ' + esc(HS.money(o.total)) + '</a>';
      if (s.key === 'shipped' && trackHref) btn = '<a class="btn sm" href="' + esc(trackHref) + '" rel="noopener" target="_blank">Track your package</a>';
      if (s.key === 'installed') btn = '<a class="btn sm" href="../how-to-install/">Install guide</a>';
      return '<div class="panel"><p>' + p + '</p>' + btn + '</div>';
    }

    var tl = steps.map(function (s, i) {
      var state = i === cur ? 'current' + (s.done ? ' done-cur' : '') : (s.done ? 'done' : 'todo');
      var when = s.date ? HS.date(s.date, LONG) : (s.done ? 'Done' : (i === cur ? 'Up next' : ''));
      var sr = i === cur ? 'Current step' : (s.done ? 'Done' : 'Not started');
      return '<li class="step ' + state + '"' + (i === cur ? ' aria-current="step"' : '') + '>' +
        '<span class="dot" aria-hidden="true">' + CHECK_SVG + '</span>' +
        '<div class="txt"><h2>' + esc(s.name) + ' <span class="visually-hidden">(' + sr + ')</span></h2>' +
        (when ? '<p class="when">' + esc(when) + '</p>' : '') + extra(s) +
        (i === cur ? panelFor(s) : '') + '</div></li>';
    }).join('');

    var headline, eta = '';
    if (cur === -1) { headline = 'All done. Enjoy your shades!'; }
    else if (curKey === 'installed') { headline = 'Delivered ' + HS.date(o.deliveredDate); eta = 'Time to hang them. The install guide walks you through it.'; }
    else if (curKey === 'shipped') { headline = 'Shipped ' + HS.date(o.shippedDate); eta = 'On its way to you.'; }
    else if (curKey === 'prod') { headline = o.orderedDate ? 'In production' : 'Paid \u2014 ordering now'; if (shipFrom) eta = 'Estimated ship window: <b>' + esc(HS.date(shipFrom)) + ' \u2013 ' + esc(HS.date(shipTo)) + '</b><br><span style="font-size:14px">2\u20134 weeks from payment</span>'; }
    else { headline = steps[cur].name === 'Paid' ? 'Ready to pay' : 'Getting ready'; eta = 'Ships 2–4 weeks after payment.'; }

    var fit = remakeUntil
      ? 'Fit guarantee until ' + esc(HS.date(remakeUntil, { month: 'long', day: 'numeric', year: 'numeric' })) + '. If a checked shade doesn’t fit, we remake it free.'
      : 'Once your shades arrive, you have 30 days for a free remake if a checked shade doesn’t fit.';

    main.innerHTML =
      '<div class="page-head"><p class="eyebrow">' + esc(o.name || 'Your order') + (c.designCode ? ' · ' + esc(c.designCode) : '') + '</p><h1>Order status</h1></div>' +
      '<section class="card summary" aria-label="Summary"><p class="status">' + esc(headline) + '</p>' + (eta ? '<p class="eta">' + eta + '</p>' : '') +
        '<div class="meta">' + (o.windowCount ? '<span><b>' + o.windowCount + '</b> shade' + (o.windowCount === 1 ? '' : 's') + '</span>' : '') +
        (o.total ? '<span>Your price <b>' + esc(HS.money(o.total)) + '</b></span>' : '') +
        (o.projectToken ? '<a href="../my-windows/?t=' + encodeURIComponent(o.projectToken) + '">See my windows</a>' : '') + '</div></section>' +
      '<ol class="timeline" aria-label="Order progress">' + tl + '</ol>' +
      '<aside class="note" aria-labelledby="fit-h"><svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M14 3l9 3.5v6.8c0 5.6-3.8 10-9 11.7-5.2-1.7-9-6.1-9-11.7V6.5L14 3z" fill="#F3DCD3" stroke="#A9594A" stroke-width="1.6"/><path d="M9.5 14.2l3.1 3 5.9-6" stroke="#4E8B5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<div><h2 id="fit-h">Fit guarantee</h2><p>' + fit + ' <a href="../how-it-works/#fit">Details</a></p></div></aside>' +
      '<div class="cta"><a class="btn ghost" href="../how-to-install/">Install guide</a><a class="btn gold" href="' + esc(sms) + '">Text Dana</a></div>';
    main.setAttribute('aria-busy', 'false');
  }

  function fail(e) {
    main.innerHTML = '<div class="state"><h1>Hmm, we can’t open this</h1><p>' + esc(e.message || 'Something went wrong.') + '</p>' +
      '<a class="btn gold" href="' + esc(HS.smsHref('Hi Dana! My order link isn’t working.')) + '">Text Dana</a></div>';
    main.setAttribute('aria-busy', 'false');
  }

  HS.getOrder(token).then(render, fail);
});
</script>
</body>
</html>
