<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hello Shade · Coming soon</title>
<meta name="description" content="Custom window shades with a designer by text. Coming soon.">
<meta name="theme-color" content="#FBF6F0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--cream:#FBF6F0;--surface:#FFFDFB;--blush:#F3DCD3;--line:#EAD7CE;--clay:#A9594A;--honey:#E8AE45;--cocoa:#4A3530;--muted:#7A5F57}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--cocoa);font-family:'DM Sans',system-ui,sans-serif}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;text-align:center}
.mark{color:var(--cocoa);font-family:Fraunces,Georgia,serif;font-weight:500;font-size:clamp(40px,10vw,64px);letter-spacing:-.01em;display:inline-flex;align-items:flex-end;gap:10px;margin:0}
.mark svg{width:1.1em;height:.7em}
h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:clamp(24px,5vw,32px);margin:28px 0 8px}
p{margin:0;color:var(--muted);font-size:17px;line-height:1.5;max-width:30ch}
.team{margin-top:56px}
.team button.link{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:8px}
form{display:none;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(320px,100%);text-align:left}
form.open{display:block}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--cocoa);margin-bottom:14px}
input:focus{outline:2px solid var(--clay);outline-offset:1px}
.btn{width:100%;font:inherit;font-weight:600;font-size:16px;padding:13px;border:0;border-radius:999px;background:var(--clay);color:#fff;cursor:pointer}
.err{color:var(--clay);font-size:14px;min-height:20px;margin:10px 0 0}
</style>
</head>
<body>
<main>
  <p class="mark" aria-label="hello shade">hello shade<svg viewBox="0 0 64 40" aria-hidden="true"><path d="M32 12V4M43 14.9L47 8M21 14.9L17 8M51 23L58 19M13 23L6 19" stroke="#E8AE45" stroke-width="3.5" stroke-linecap="round"/><path d="M14 34A18 18 0 0 1 50 34Z" fill="#E8AE45"/><rect x="2" y="34" width="60" height="3" rx="1.5" fill="#A9594A"/></svg></p>
  <h1>Coming soon</h1>
  <p>Custom shades, a designer by text, and none of the in-home hassle.</p>
  <div class="team">
    <button class="link" type="button" id="teamBtn" aria-expanded="false" aria-controls="login">Team login</button>
    <form id="login" autocomplete="on" novalidate>
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false">
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password">
      <button class="btn" type="submit">Enter</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </div>
</main>
<script>
(function () {
  var KEY = 'hs_preview', TOKEN = '201717ae3b819a28eec7d3bfd11a09941a681a7abf361123e02425277599ee77';
  var btn = document.getElementById('teamBtn'), form = document.getElementById('login'), err = document.getElementById('err');
  function next() {
    var n = new URLSearchParams(location.search).get('next') || '/';
    return n.charAt(0) === '/' && n.charAt(1) !== '/' ? n : '/';
  }
  try { if (localStorage.getItem(KEY) === TOKEN) { location.replace(next()); return; } } catch (e) {}
  btn.addEventListener('click', function () {
    var open = form.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(open));
    if (open) document.getElementById('u').focus();
  });
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var u = document.getElementById('u').value.trim().toLowerCase(), p = document.getElementById('pw').value;
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(u + ':' + p));
    var hex = Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    if (hex === TOKEN) { try { localStorage.setItem(KEY, TOKEN); } catch (e2) {} location.replace(next()); }
    else { err.textContent = 'That username or password is not right.'; }
  });
})();
</script>
</body>
</html>
